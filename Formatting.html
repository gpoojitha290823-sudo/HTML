<!---------------- HTML Text Formatting -------------->

<!-------------- <br> ( Bold text )--------------->
<!DOCTYPE html>
<html>
    <body>
        <h1>Heading</h1>
        <p>
            <b>
                This text is bolded.
            </b>
         </p>


<!------------- <strong> ( Important text )-------------->
        <p>
            <strong>
                This text is important. 
            </strong>
        </p>

 <!-------------- <i> ( Italic Text)------------->
    <p>
        <i>
            This text is italic.
        </i>
    </p>
<!--------------- <em> ( Emphasized Text)---------------->
    <p>
        <em>
            This text is emphasized.
        </em>
    </p>
<!--------------- <small> ( Smaller text)---------------->
    <p>
        <small>
            This text is smaller.
        </small>
    </p>
<!--------------- <mark> ( Marked Text)----------------->
    <p>
        This is a <mark> marked text.</mark>
    </p>
<!--------------- <del> ( Deleted Text )--------------->
    <p>
        This is a <del> deleted </del> text.
    </p>
<!-------------- <ins> ( Inserted Text )--------------->
    <p>
        This is a <ins> inserted</ins> text.
        This is another <del> inserted</del> <ins>text</ins>
    </p>
<!-------------- <sub> ( Subscript Text )-------------->
    <p>
        Hello <sub> world</sub>
    </p>
<!-------------- <sup> ( Superscript Text )-------------->
    <p>
       Hello <sup>world</sup>
    </p>
    </body>
</html>
