<!DOCTYPE html>
<html>
    <body>
        <h>Heading</h>  
        <p>Paragraph</p>
    </body>
</html>


<!---<htm>, <body>, <h>, <p> are the tags--->

<!--Heading, Paragraph are the elements-->

<!--|(start tag) <h> | (Element) Heading | (end tag) </h>-->

<!DOCTYPE html>
<html>
    <body>
        <P> paragraph
        </p>
    </body>
</html>

<!--HTML is not case sensitive ( <P> = </p>)-->

<!DOCTYPE html>
<html>
    <body>
        <p>
            This is a <br> paragraph with a line break
        </p>
    </body>
</html>

<!--<br> tag  defines a line break and is an empty element without closing a tag -->
